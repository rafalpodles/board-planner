<rect class="base" x="418" y="66" width="104" height="38" rx="10"/>
<rect class="lit a-lit3" x="418" y="66" width="104" height="38" rx="10"/>
<text class="t" x="470.0" y="90.0" text-anchor="middle">gates</text>
<line class="wire" x1="525" y1="85.0" x2="543" y2="85.0"/>
<line class="flow a-flow3" x1="525" y1="85.0" x2="543" y2="85.0"/>
<rect class="base" x="546" y="66" width="104" height="38" rx="10"/>
<rect class="lit a-lit4" x="546" y="66" width="104" height="38" rx="10"/>
<text class="t" x="598.0" y="90.0" text-anchor="middle">push</text>
<line class="wire" x1="653" y1="85.0" x2="671" y2="85.0"/>
<line class="flow a-flow4" x1="653" y1="85.0" x2="671" y2="85.0"/>
<rect class="base" x="674" y="66" width="134" height="38" rx="10"/>
