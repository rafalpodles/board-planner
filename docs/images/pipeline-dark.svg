<text class="t" x="741.0" y="90.0" text-anchor="middle">pull request</text>
<line class="wire" x1="811" y1="85.0" x2="833" y2="85.0"/>
<line class="flow a-flow5" x1="811" y1="85.0" x2="833" y2="85.0"/>
<rect class="base" x="836" y="66" width="104" height="38" rx="10"/>
<rect class="lit you a-lit6" x="836" y="66" width="104" height="38" rx="10"/>
<text class="t" x="888.0" y="90.0" text-anchor="middle">you</text>
<circle class="dot" cx="427.5" cy="128" r="5"/>
