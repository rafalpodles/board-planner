services:
  mongo:
    # 4.4 on purpose: the aggregations avoid 5.0-only operators and this keeps that honest
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    # The published image, pulled when it is not already here. `docker compose up -d --build`
    # builds this checkout instead and tags the result with the same name
    image: ghcr.io/rafalpodles/board-planner:${BOARD_PLANNER_VERSION:-latest}
    pull_policy: missing
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    # Every variable in .env reaches the app; the entries under `environment:` win over it
    env_file:
      - path: .env
        required: false
    environment:
      # Pinned so a .env written for `npm run dev` cannot move the port, the bind address or the mode
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/boardplanner}
      # auto: a plain cookie only while PUBLIC_ORIGIN and every APP_ORIGIN are http://, as on this
      # file's localhost defaults; an https PUBLIC_ORIGIN makes it Secure with nothing else to change.
      # 0 forces the secure cookie, 1 forces the plain one
      COOKIE_ALLOW_INSECURE: ${COOKIE_ALLOW_INSECURE:-auto}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${APP_PORT:-3000}}
      # 0 unless something in front of the app appends to X-Forwarded-For — the login throttle
      # keys on it, and an unset value means the header is ignored rather than trusted
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # This instance's own address, and the base of every link it sends out. Behind a proxy, set
      # it to the public one — APP_ORIGIN is a list and cannot say which entry that is.
      # NEXT_PUBLIC_APP_URL is the name it had before BP-766, still honoured here and nowhere else
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-${NEXT_PUBLIC_APP_URL:-http://localhost:${APP_PORT:-3000}}}
      # The setup code for the first account; empty means one is generated and printed to the log
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      # Everything below is optional — leave it empty and the feature stays off
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_DAILY_GENERATION_CAP: ${AI_DAILY_GENERATION_CAP:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PM_MODEL: ${PM_MODEL:-}
      PM_MAX_TOKENS: ${PM_MAX_TOKENS:-}
      PM_DAILY_TURN_CAP: ${PM_DAILY_TURN_CAP:-}
      PM_DAILY_TOKEN_CAP: ${PM_DAILY_TOKEN_CAP:-}
      PM_SCHEDULER_TICK_MS: ${PM_SCHEDULER_TICK_MS:-}
      # The exception to the line above, twice over: left empty, this one does not leave a feature
      # off, it refuses to store any secret — integration tokens, and a project's Slack/Discord
      # channels. And set to anything other than 32 bytes of hex or base64, it stops the app
      # starting, rather than being ignored
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEYS_OLD: ${ENCRYPTION_KEYS_OLD:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}

volumes:
  mongo-data:
