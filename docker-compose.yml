services:
  mongo:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${APP_PORT:-3000}}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/boardplanner}
      COOKIE_ALLOW_INSECURE: ${COOKIE_ALLOW_INSECURE:-1}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${APP_PORT:-3000}}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:${APP_PORT:-3000}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PM_MODEL: ${PM_MODEL:-}
      PM_MAX_TOKENS: ${PM_MAX_TOKENS:-}
      PM_DAILY_TURN_CAP: ${PM_DAILY_TURN_CAP:-}
      PM_DAILY_TOKEN_CAP: ${PM_DAILY_TOKEN_CAP:-}
      PM_SCHEDULER_TICK_MS: ${PM_SCHEDULER_TICK_MS:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEYS_OLD: ${ENCRYPTION_KEYS_OLD:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}

volumes:
  mongo-data:
