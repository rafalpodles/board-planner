name: CI

on:
  push:
  workflow_dispatch:

# A branch that gets several commits in a row only needs the newest one checked
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # Runs even when the type check failed: the group guard lives here, and a spec that belongs
      # to no CI job is exactly the thing you want to hear about while you are still editing
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      # Proven not to touch the database: the build succeeds against an unreachable URI, so this
      # value only exists to keep the step from depending on whatever the runner happens to have
      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:1/build-does-not-connect

      # A prerendered page has no request to draw a nonce from, so under the proxy's policy every
      # script on it is refused (BP-313)
      - name: No page is prerendered outside the allowlist
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-static-pages.ts

      # The Dockerfile copies only .next/standalone, and whether the instrumentation hook gets
      # packaged into it is decided by a non-recursive scan of the app directory's parent — so a
      # file one directory too high builds cleanly, emits its chunk, and is simply absent from the
      # image, taking the PM scheduler and all seeding with it. The ordinary build above cannot see
      # that: it passed while the image was broken (BP-356).
      - name: Standalone output carries the instrumentation hook
        run: |
          BUILD_STANDALONE=1 npm run build
          test -f .next/standalone/.next/server/instrumentation.js \
            || { echo "::error::instrumentation.js is missing from .next/standalone — register() will not run in the Docker image"; exit 1; }
        env:
          MONGODB_URI: mongodb://127.0.0.1:1/build-does-not-connect

      # Last, and `if: !cancelled()` for the same reason: this step fails on advisories published
      # by other people overnight, which nobody can fix from their own branch. Run first it would
      # hide a type error behind a supply-chain event; run last and skipped on cancellation, the
      # compile and build results still reach whoever is waiting for them.
      #
      # `npm audit` reads the lockfile, so nothing needs installing first. Fails on a critical or
      # high against a production dependency unless src/lib/audit-policy.ts accepts that exact
      # advisory with a reason, and on an audit that could not run at all. BP-599 exists because a reachability judgement written on a
      # ticket in August was false by September with nothing failing in between.
      - name: Production dependencies carry no unaccepted advisory
        if: ${{ !cancelled() }}
        # `--disable-warning` rather than `"type": "module"` in package.json: Node warns on every
        # run that it had to reparse a .ts file as ESM, and the documented fix would change the
        # semantics of every .js in the repo to silence two lines on one step's stderr.
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/audit-production.ts

  db-integration:
    name: App — connection lifecycle against a real mongod
    # `npm test` skips db.integration.test.ts, since the app job has no database. 4.4 because
    # production is, and because the test holds a query open with `$where`/`sleep()`, which
    # newer servers deprecate
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Integration tests
        run: npx vitest run src/lib/db.integration.test.ts
        env:
          MONGODB_INTEGRATION_URI: mongodb://127.0.0.1:27017/db_integration

  worker:
    name: Worker — the package npm test never reaches
    # macOS since BP-349, and not for convenience: the worker confines the agent it runs with
    # seatbelt, which is macOS only, so on Linux `confine()` refuses and 114 tests across eight
    # files assert a spawn that never happens. Pinning the platform in those tests instead would
    # buy a green Linux job that exercises a configuration nobody runs, and would leave
    # sandbox.integration.test.ts — the only evidence that the kernel actually denies the write —
    # skipped in CI, which is where it was measured to be worth the most.
    runs-on: macos-15
    # The root vitest config includes src/** only, so these 680-odd tests run nowhere else
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # `npm run build` compiles src/ with the tests excluded, and vitest does not type-check at
      # all, so nothing here had ever read a worker test file's types. The script existed and was
      # called by no one; 27 errors had collected behind it, including a test asserting a config
      # shape the worker never serves (BP-334).
      # Named for what it covers: tsconfig.test.json globs all of src/**, so this is the tests plus
      # the sources they import, and a production type error surfaces here rather than at Build
      - name: Types (tests and the sources they import)
        run: npm run typecheck:tests
      # Runs even when the type check failed. Steps are fail-fast, so one bad annotation used to
      # mean the 866 worker tests never ran and the job reported no test result at all — the type
      # error is the cheaper thing to know, and it must not cost the answer to "did behaviour break"
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  # The worker's tests need a kernel that can confine, so they run on macOS above. Building it does
  # not — and the README supports running the worker on Linux with CP_ALLOW_UNCONFINED_AGENT=1, a
  # configuration that after that move nothing compiled at all. A minute here keeps the platform we
  # say we support from breaking silently; it deliberately runs no tests, because on Linux the ones
  # about the sandbox assert a spawn that cannot happen.
  worker-linux:
    name: Worker — it still builds on the platform the escape hatch is for
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck:tests
      - run: npm run build

  e2e_production_csp:
    # The CSP nonce is a production-build behaviour — dev adds 'unsafe-eval' and scripts of its
    # own — and every other e2e job runs `next dev`. Started through `npm start`, the way Railway
    # starts it, which is also what the keep-alive spec is about (BP-313, BP-814).
    name: End to end — CSP against a production build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'
      - name: Tests
        env:
          E2E_PROD: "1"
        run: npx playwright test e2e/content-security-policy.spec.ts e2e/keep-alive-timeout.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-production-csp
          path: e2e/.artifacts
          include-hidden-files: true
          retention-days: 7

  # The process the app ships beside itself, run for real against the e2e app (BP-711): the worker.
  # A job of its own, outside the e2e groups, so a slow or platform-bound smoke cannot hold up the
  # main suite. It opens no page, so it installs no browser. The menubar stays on its own Swift job
  # and the contract tests.
  # macOS for the reason the worker job above is: the agent runs under seatbelt. No Docker on a
  # macOS runner, so MongoDB comes from MongoDB's own tarball.
  smoke_worker:
    name: Smoke — the real worker against the app
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MONGODB_VERSION: 7.0.14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - uses: actions/cache@v6
        id: mongodb-cache
        with:
          path: ~/mongodb
          key: mongodb-${{ runner.os }}-${{ runner.arch }}-${{ env.MONGODB_VERSION }}
      - name: Download MongoDB
        if: steps.mongodb-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/mongodb
          curl -fsSL "https://fastdl.mongodb.org/osx/mongodb-macos-arm64-${MONGODB_VERSION}.tgz" \
            | tar -xz -C ~/mongodb --strip-components=1
      - name: Start MongoDB
        run: |
          mkdir -p "$RUNNER_TEMP/mongo-data"
          ~/mongodb/bin/mongod --dbpath "$RUNNER_TEMP/mongo-data" --bind_ip 127.0.0.1 --port 27017 \
            --fork --logpath "$RUNNER_TEMP/mongod.log"
      - run: npm ci
      - run: npm ci
        working-directory: worker
      # A production build, as the server the worker really talks to is. In one run under `next dev` the
      # worker's comment, status and release calls answered 404 while claim and runs succeeded; the cause
      # was not established (BP-1050)
      - name: Smoke
        env:
          E2E_PROD: "1"
        run: npx playwright test -c playwright.smoke.config.ts --project=worker
      # The worker creates worker.lock write-only, and a socket left by a killed worker cannot be opened:
      # the archiver fails on either, so a failed smoke uploaded nothing (BP-1049)
      - name: Make the artifacts readable
        if: failure() || cancelled()
        run: |
          chmod -R u+rX e2e/.artifacts || true
          find e2e/.artifacts -type s -delete || true
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: smoke-artifacts-worker
          path: |
            e2e/.artifacts
            ${{ runner.temp }}/mongod.log
          include-hidden-files: true
          retention-days: 7

  # The real licence service and the app together, against a Stripe stand-in (BP-979): each side's own suite stubs the
  # other, so this is the only place the signatures and answers they exchange meet. The service is a private
  # repository, so the job needs a token that can read it: make it a fine-grained token (or a deploy key) for that one
  # repository with Contents: read, nothing more. Until the repository variable LICENCE_SMOKE_ENABLED is "true" and the
  # secret LICENCE_SERVICE_TOKEN exists it is skipped, which the gate below counts as passing: run the smoke by hand
  # meanwhile (e2e/smoke/licence.smoke.ts says how). Its logs are not uploaded: the service's carry code frames of a
  # private repository, and this one is public.
  smoke_licence:
    name: Smoke — the real licence service with the app
    if: ${{ vars.LICENCE_SMOKE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rafalpodles/board-planner-licence
          token: ${{ secrets.LICENCE_SERVICE_TOKEN }}
          path: licence-service
          # The token must not stay in that repository's git config while its own scripts run
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            licence-service/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: licence-service
      - run: npx playwright install --with-deps chromium
      - name: Smoke
        env:
          E2E_ORGANISATIONS_SERVER: "1"
          LICENCE_SERVICE_DIR: ${{ github.workspace }}/licence-service
        run: npx playwright test -c playwright.smoke.config.ts --project=licence
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-artifacts-licence
          path: |
            e2e/.artifacts
            !e2e/.artifacts/licence-smoke/licence-service.log
          include-hidden-files: true
          retention-days: 7

  backup:
    name: Backup — dump, upload, read back, restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: ./backup/test.sh

  plan_e2e:
    # Decides which of the seven groups below this push can possibly affect, so a change confined to
    # one feature area doesn't pay for all seven. See e2e/affected-groups.ts for the mapping and the
    # fail-safe rules; scripts/plan-e2e-groups.ts turns its answer into the output the matrix job
    # reads. No `npm ci` here — the script imports nothing outside this repo's own TypeScript.
    name: Plan — which e2e groups this change touches
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Decide
        id: plan
        run: |
          set +e
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/plan-e2e-groups.ts
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] || ! grep -q '^groups=' "$GITHUB_OUTPUT"; then
            echo "::warning::could not determine affected e2e groups, running all of them"
            echo 'groups=["tasks","task-fields","board","project","people","automation","a11y"]' >> "$GITHUB_OUTPUT"
          fi

  e2e:
    # One job per group in e2e/groups.ts, each with a runner, a Mongo and a dev server of its own,
    # so the groups need no isolation from one another. `groups.test.ts` fails the unit job when
    # this list and that file disagree, and when a spec belongs to no group at all. The matrix
    # always lists all seven — plan_e2e decides which of them actually run. That gate is a step-level
    # `if:`, not a job-level one: the `matrix` context (needed to compare against plan_e2e's answer)
    # is only available to steps, not to a job's own `if:`. An unaffected group's job still starts,
    # and its first step says there is nothing to run; every other step is skipped, so it costs the
    # seconds of a runner starting rather than an install and a browser.
    #
    # A group is also cut into shards, because the longest of them set the wall time of the whole
    # run: `project` alone was 43 minutes of one runner while `task-fields` took six. `shard` is
    # a second matrix dimension of 1 to 3 and SHARDS below says how many each group really has;
    # a job whose number is past its group's count has nothing to run and ends after one step.
    # Playwright's `--shard=n/m` splits a project's spec files between the jobs, each with a
    # runner, a Mongo and a dev server of its own like the groups, so no spec shares state with
    # another. The counts were set from the durations of run 38291632092 (project 41 min of tests,
    # people 30, tasks 26, automation 24, board 21, task-fields 6) to bring every job under about
    # 18 minutes; move them with the durations.
    #
    # `if: !cancelled()` plus the `!= 'success'` half of the "Whether plan_e2e picked this group"
    # check below both exist for the same failure the plan_e2e job's own internal fallback can't
    # reach: plan_e2e failing outright (checkout, setup-node, an infra hiccup) rather than its
    # script failing. `needs:` alone would then skip every e2e job — running zero of seven groups,
    # the opposite of "ambiguous means run everything." `!= 'success'` short-circuits before
    # `fromJson` ever sees a possibly-empty `outputs.groups`.
    name: End to end — ${{ matrix.group }} (shard ${{ matrix.shard }})
    needs: plan_e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # e2e-groups-start
        group: [tasks, task-fields, board, project, people, automation, a11y]
        # e2e-groups-end
        shard: [1, 2, 3]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      # First, and before the checkout: a job with nothing to run (a group plan_e2e left out, or a
      # shard past its group's count) should cost the seconds it takes to say so, not a `npm ci`
      - name: Whether this job has tests to run
        id: affected
        env:
          # How many shards each group is cut into, at most the three the matrix lists (BP-1042)
          SHARDS: '{"tasks":2,"task-fields":1,"board":2,"project":3,"people":2,"automation":2,"a11y":1}'
          PICKED: ${{ needs.plan_e2e.result != 'success' || contains(fromJson(needs.plan_e2e.outputs.groups), matrix.group) }}
        run: |
          shards=$(echo "$SHARDS" | jq -r --arg group "${{ matrix.group }}" '.[$group] // 1')
          if [ "$PICKED" = "true" ] && [ "${{ matrix.shard }}" -le "$shards" ]; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.group }} shard ${{ matrix.shard }} of $shards: run=$run"

      - uses: actions/checkout@v7
        if: steps.affected.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.affected.outputs.run == 'true'
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        if: steps.affected.outputs.run == 'true'

      # Keyed on the resolved Playwright version: a browser cache from an older one is not
      # merely stale, it fails to launch
      - name: Playwright version
        id: pw
        if: steps.affected.outputs.run == 'true'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser-cache
        if: steps.affected.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.affected.outputs.run == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.affected.outputs.run == 'true' && steps.browser-cache.outputs.cache-hit == 'true'

      - name: Tests
        if: steps.affected.outputs.run == 'true'
        env:
          # Only the job that owns proxied-login-throttle.spec.ts pays for the second dev server —
          # see RUN_PROXIED_SERVER in playwright.config.ts. Every other group leaves this unset and
          # gets exactly the servers it already started (BP-409).
          E2E_PROXIED_SERVER: ${{ matrix.group == 'people' && '1' || '' }}
          # The same for the server with password sign-in off (BP-830)
          E2E_PASSWORDLESS_SERVER: ${{ matrix.group == 'people' && '1' || '' }}
          # And the one with ORGANISATION_DOMAIN set, where organisations live on subdomains (BP-670)
          E2E_ORGANISATIONS_SERVER: ${{ matrix.group == 'people' && '1' || '' }}
          # Every request the app server received and when each test ran, for route_groups below (BP-1081)
          E2E_REQUEST_LOG_DIR: ${{ github.workspace }}/e2e/.request-log
        # Next's dev server sometimes answers a bare 404 page for routes that exist, and keeps doing so
        # until the process ends (BP-1042). A per-test retry runs on the same process, so the tests that
        # failed run once more on a fresh one; a real failure fails again and the job stays red.
        run: |
          if ! npx playwright test --project=${{ matrix.group }} --shard=${{ matrix.shard }}/${{ steps.affected.outputs.shards }}; then
            echo "::warning title=e2e second pass::the first pass of ${{ matrix.group }} shard ${{ matrix.shard }} failed; its failed tests run once more on a fresh dev server (BP-1042)"
            rm -rf e2e/.artifacts-first-pass && cp -R e2e/.artifacts e2e/.artifacts-first-pass
            npx playwright test --project=${{ matrix.group }} --last-failed
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.affected.outputs.run == 'true' }}
        with:
          name: request-log-${{ matrix.group }}-${{ matrix.shard }}
          path: e2e/.request-log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # The trace is the only way to see what the page looked like when a run fails on a machine
      # nobody can open
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-${{ matrix.group }}-${{ matrix.shard }}
          path: |
            e2e/.artifacts
            e2e/.artifacts-first-pass
          include-hidden-files: true
          retention-days: 7

  route_groups:
    # A change to a route file runs the groups whose specs call it directly, and e2e/route-groups.json
    # is where most of them come from: measured from the request logs the e2e jobs above upload,
    # because a hand-kept table drifted from them within weeks (BP-1081). This job holds a push to
    # that: a spec calling a route from a group a change to the route would not run fails here,
    # naming both. Only the groups that ran are measured, so a pull request checks what it touched;
    # a run of every group that passed also writes the map it measured, as the `route-groups`
    # artifact, which is how the file is regenerated. Like plan_e2e, it needs no `npm ci`.
    name: Route files — every direct caller is in the plan
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v7
        with:
          pattern: request-log-*
          path: request-logs
      - name: Every direct caller is in its route's plan
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/route-groups.ts check request-logs
      - name: The map this run measured
        id: measured
        if: ${{ !cancelled() && needs.e2e.result == 'success' && (github.ref_name == 'main' || github.event_name == 'workflow_dispatch') }}
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/route-groups.ts write request-logs
          git diff --stat -- e2e/route-groups.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.measured.outcome == 'success' }}
        with:
          name: route-groups
          path: e2e/route-groups.json
          retention-days: 30

  # The one check main's ruleset requires: a required per-job check would wait forever on an e2e
  # group plan_e2e left out. `groups.test.ts` fails when a job is missing from `needs`.
  ci-passed:
    name: CI passed
    needs:
      - app
      - db-integration
      - worker
      - worker-linux
      - e2e_production_csp
      - smoke_worker
      - smoke_licence
      - backup
      - plan_e2e
      - e2e
      - route_groups
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: No needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
