name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Standalone MCP server dependencies
        if: ${{ !cancelled() }}
        working-directory: mcp-server
        run: npm ci

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:1/build-does-not-connect

      - name: Standalone output carries the instrumentation hook
        run: |
          BUILD_STANDALONE=1 npm run build
          test -f .next/standalone/.next/server/instrumentation.js \
            || { echo "::error::instrumentation.js is missing from .next/standalone — register() will not run in the Docker image"; exit 1; }
        env:
          MONGODB_URI: mongodb://127.0.0.1:1/build-does-not-connect

  worker:
    name: Worker — the package npm test never reaches
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Types (tests and the sources they import)
        run: npm run typecheck:tests
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  mcp-server:
    name: MCP server — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: End to end — ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # e2e-groups-start
        group: [tasks, task-fields, board, project, people, automation]
        # e2e-groups-end
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'

      - name: Tests
        run: npx playwright test --project=${{ matrix.group }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-${{ matrix.group }}
          path: e2e/.artifacts
          retention-days: 7
