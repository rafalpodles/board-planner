name: CI

on:
  push:
  workflow_dispatch:

# A branch that gets several commits in a row only needs the newest one checked
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # Deliberately before the sibling package is installed: the Docker image never has
      # mcp-server/node_modules (.dockerignore drops **/node_modules) and `next build` type-checks
      # everything tsconfig globs, so a literal path into it compiles here and breaks the
      # production build. Installing first hid exactly that, and Railway found it (BP-501).
      - name: Types
        run: npx tsc --noEmit

      # Needed to RUN the standalone spec, not to type-check it. Runs even when the types failed,
      # so that failure stays the one reported rather than cascading into a missing module
      - name: Standalone MCP server dependencies
        if: ${{ !cancelled() }}
        working-directory: mcp-server
        run: npm ci

      # Runs even when the type check failed: the group guard lives here, and a spec that belongs
      # to no CI job is exactly the thing you want to hear about while you are still editing
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      # Proven not to touch the database: the build succeeds against an unreachable URI, so this
      # value only exists to keep the step from depending on whatever the runner happens to have
      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:1/build-does-not-connect

      # The Dockerfile copies only .next/standalone, and whether the instrumentation hook gets
      # packaged into it is decided by a non-recursive scan of the app directory's parent — so a
      # file one directory too high builds cleanly, emits its chunk, and is simply absent from the
      # image, taking the PM scheduler and all seeding with it. The ordinary build above cannot see
      # that: it passed while the image was broken (BP-356).
      - name: Standalone output carries the instrumentation hook
        run: |
          BUILD_STANDALONE=1 npm run build
          test -f .next/standalone/.next/server/instrumentation.js \
            || { echo "::error::instrumentation.js is missing from .next/standalone — register() will not run in the Docker image"; exit 1; }
        env:
          MONGODB_URI: mongodb://127.0.0.1:1/build-does-not-connect

      # Last, and `if: !cancelled()` for the same reason: this step fails on advisories published
      # by other people overnight, which nobody can fix from their own branch. Run first it would
      # hide a type error behind a supply-chain event; run last and skipped on cancellation, the
      # compile and build results still reach whoever is waiting for them.
      #
      # Both trees that reach production, root and mcp-server — `npm audit` reads the lockfile, so
      # neither needs installing first. Fails on a critical or high against a production dependency
      # unless src/lib/audit-policy.ts accepts that exact advisory with a reason, and on an audit
      # that could not run at all. BP-599 exists because a reachability judgement written on a
      # ticket in August was false by September with nothing failing in between.
      - name: Production dependencies carry no unaccepted advisory
        if: ${{ !cancelled() }}
        # `--disable-warning` rather than `"type": "module"` in package.json: Node warns on every
        # run that it had to reparse a .ts file as ESM, and the documented fix would change the
        # semantics of every .js in the repo to silence two lines on one step's stderr.
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/audit-production.ts

  worker:
    name: Worker — the package npm test never reaches
    # macOS since BP-349, and not for convenience: the worker confines the agent it runs with
    # seatbelt, which is macOS only, so on Linux `confine()` refuses and 114 tests across eight
    # files assert a spawn that never happens. Pinning the platform in those tests instead would
    # buy a green Linux job that exercises a configuration nobody runs, and would leave
    # sandbox.integration.test.ts — the only evidence that the kernel actually denies the write —
    # skipped in CI, which is where it was measured to be worth the most.
    runs-on: macos-15
    # The root vitest config includes src/** only, so these 680-odd tests run nowhere else
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # `npm run build` compiles src/ with the tests excluded, and vitest does not type-check at
      # all, so nothing here had ever read a worker test file's types. The script existed and was
      # called by no one; 27 errors had collected behind it, including a test asserting a config
      # shape the worker never serves (BP-334).
      # Named for what it covers: tsconfig.test.json globs all of src/**, so this is the tests plus
      # the sources they import, and a production type error surfaces here rather than at Build
      - name: Types (tests and the sources they import)
        run: npm run typecheck:tests
      # Runs even when the type check failed. Steps are fail-fast, so one bad annotation used to
      # mean the 866 worker tests never ran and the job reported no test result at all — the type
      # error is the cheaper thing to know, and it must not cost the answer to "did behaviour break"
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  # The worker's tests need a kernel that can confine, so they run on macOS above. Building it does
  # not — and the README supports running the worker on Linux with CP_ALLOW_UNCONFINED_AGENT=1, a
  # configuration that after that move nothing compiled at all. A minute here keeps the platform we
  # say we support from breaking silently; it deliberately runs no tests, because on Linux the ones
  # about the sandbox assert a spawn that cannot happen.
  worker-linux:
    name: Worker — it still builds on the platform the escape hatch is for
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck:tests
      - run: npm run build

  mcp-server:
    name: MCP server — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    # One job per group in e2e/groups.ts, each with a runner, a Mongo and a dev server of its own,
    # so the groups need no isolation from one another. `groups.test.ts` fails the unit job when
    # this list and that file disagree, and when a spec belongs to no group at all.
    name: End to end — ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # e2e-groups-start
        group: [tasks, task-fields, board, project, people, automation]
        # e2e-groups-end
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # Keyed on the resolved Playwright version: a browser cache from an older one is not
      # merely stale, it fails to launch
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'

      - name: Tests
        run: npx playwright test --project=${{ matrix.group }}

      # The trace is the only way to see what the page looked like when a run fails on a machine
      # nobody can open
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-${{ matrix.group }}
          path: e2e/.artifacts
          retention-days: 7
