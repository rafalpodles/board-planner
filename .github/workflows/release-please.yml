name: Release Please

# Keeps one release PR open against main. Merging it tags vX.Y.Z and creates the GitHub release as a
# draft, and the same run builds and attaches the assets and only then publishes it (BP-772): a tag
# created with GITHUB_TOKEN starts no workflow.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Update the release PR, or release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  release:
    name: Release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # The ceiling for every job in release.yml: publish writes the release, image pushes to GHCR
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    # A called workflow sees environment secrets only for secrets its caller passes on
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag }}
