name: Debug tmp
on:
  push:
    branches: [bp-1092/mutation-sample]
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/link-leaves-a-trace.spec.ts -g "removes it from the end" --reporter=list 2>&1 | grep -E "DEBUG|passed|failed|Error" | cut -c1-3000
