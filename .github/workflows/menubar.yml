name: Menubar

on:
  push:
    paths:
      - "menubar/**"
      - ".github/workflows/menubar.yml"
  workflow_dispatch:

concurrency:
  group: menubar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift — build and test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: menubar
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Tests
        run: swift test
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: The assembled app carries a worker
        run: |
          make app
          test -f .build/CPMenubar.app/Contents/Resources/worker/main.js
