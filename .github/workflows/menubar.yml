name: Menubar

# Its own workflow, path-filtered, because this is the only job that needs a macOS runner and
# those bill at ten times the rate. The app's 81 tests were running nowhere before this.
on:
  push:
    paths:
      - "menubar/**"
      - "worker/pack.sh"
      - ".github/workflows/menubar.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: menubar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift — build and test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: menubar
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Tests
        run: swift test
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Building and testing the Swift never saw the defect this covers: `make app` assembled a
      # bundle with no worker in it, which fails at the end of onboarding rather than at build time.
      # Assembling it here is the only place that difference shows.
      - name: The assembled app carries a worker
        run: |
          make app
          test -f .build/CPMenubar.app/Contents/Resources/worker/main.js
      - name: The worker packs into a tarball that runs without an install
        run: |
          ../worker/pack.sh 0.0.0 "$RUNNER_TEMP/pack"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/pack/board-planner-worker-0.0.0.tar.gz" -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked/worker"
          test -f dist/main.js
          test "$(node -p 'require("./package.json").type')" = module
          node --input-type=module -e 'await import(process.cwd() + "/dist/config.js")'
