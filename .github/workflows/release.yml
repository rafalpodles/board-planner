name: Release

# A tag vX.Y.Z builds the menubar app (worker inside), signs it with the Developer ID, notarises
# and staples it, packs the worker on its own, and attaches both to the GitHub release.
# Run by hand it is a dry run: the same build, kept as a short-lived workflow artifact (downloadable
# by anyone, the repository is public) and attached to no release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the dry-run build (x.y.z)"
        default: "0.0.0"
        required: true
      signed:
        description: "Sign and notarise (needs the release environment's secrets)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, sign, notarise
    runs-on: macos-latest
    timeout-minutes: 120
    # The signing secrets live in this environment, not in the repository
    environment: ${{ (github.event_name == 'push' || inputs.signed) && 'release' || '' }}
    env:
      SIGNED: ${{ github.event_name == 'push' || inputs.signed }}
      OUT: ${{ github.workspace }}/release-assets
    outputs:
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Resolve the version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$DISPATCH_VERSION"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must be x.y.z (a tag vX.Y.Z), got '$VERSION'"
            exit 1
          fi
          if [ "$SIGNED" = "true" ]; then SUFFIX=signed; else SUFFIX=unsigned; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "artifact=release-$VERSION-$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Every signing secret is set
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=()
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::Secret $name is not set in the 'release' environment (Settings → Environments → release)"
            done
            echo "Missing: ${missing[*]}. Set them, or run by hand with 'signed' off for an unsigned dry run."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Everything that runs third-party code happens here, before any secret is written to disk
      - name: Install and build the worker
        working-directory: worker
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Swift tests
        working-directory: menubar
        run: make test

      - name: Pack the worker
        run: worker/pack.sh "$VERSION" "$OUT"

      - name: Import the Developer ID certificate into a temporary keychain
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"

          # The chain codesign needs, whether or not the runner image carries it
          curl --fail --silent --show-error --location --retry 3 \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | grep "($APPLE_TEAM_ID)" | head -1 | awk '{print $2}' || true)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 holds no 'Developer ID Application' identity for team APPLE_TEAM_ID. Identities found:"
            security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/^/  /'
            exit 1
          fi
          echo "CP_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        if: env.SIGNED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_KEY_P8_BASE64 does not decode to a .p8 private key"; exit 1; }
          {
            echo "CP_NOTARY_KEY_PATH=$KEY"
            echo "CP_NOTARY_KEY_ID=$ASC_KEY_ID"
            echo "CP_NOTARY_ISSUER=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # `make app` is `make test worker`, done above, followed by this
      - name: Bundle, sign, notarise, staple
        working-directory: menubar
        env:
          CP_ARCHS: arm64 x86_64
          CP_VERSION: ${{ env.VERSION }}
          CP_BUILD_NUMBER: ${{ github.run_number }}
          CP_NOTARY_TIMEOUT: 90m
        run: ./bundle.sh release

      - name: Gatekeeper accepts it as notarised
        if: env.SIGNED == 'true'
        working-directory: menubar
        run: |
          codesign --verify --strict --deep --verbose=2 .build/CPMenubar.app
          xcrun stapler validate .build/CPMenubar.app
          ASSESSMENT="$(spctl --assess --type execute --verbose=4 .build/CPMenubar.app 2>&1 || true)"
          echo "$ASSESSMENT"
          grep -q "source=Notarized Developer ID" <<<"$ASSESSMENT" \
            || { echo "::error::Gatekeeper did not report 'source=Notarized Developer ID'"; exit 1; }

      - name: Package
        run: |
          test -f menubar/.build/CPMenubar.app/Contents/Resources/worker/main.js
          ditto -c -k --keepParent menubar/.build/CPMenubar.app "$OUT/board-planner-menubar-$VERSION.zip"
          cd "$OUT"
          shasum -a 256 "board-planner-menubar-$VERSION.zip" "board-planner-worker-$VERSION.tar.gz" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 2 ] || { echo "::error::SHA256SUMS does not list both assets"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Delete the temporary keychain and key
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/developer-id.p12

  publish:
    name: Attach to the GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-assets

      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l release-assets
          (cd release-assets && sha256sum -c SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi

  # Independent of the macOS jobs: a failed notarisation does not hold the image back, nor the reverse.
  # The dry run below repeats these steps through anchors, so it builds exactly what a tag pushes.
  image:
    name: Publish the Docker image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - &image-version
        name: Resolve the version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$DISPATCH_VERSION"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must be x.y.z (a tag vX.Y.Z), got '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - &image-checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Every tag, to decide whether this one is the newest
          fetch-depth: 0

      # A backport tagged after a newer release must not take `latest` back to an older version
      - &image-latest
        name: Is this the newest release
        run: |
          NEWEST="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$NEWEST" = "v$VERSION" ]; then LATEST=true; else LATEST=false; fi
          echo "Newest release tag: ${NEWEST:-none}; this is v$VERSION; latest=$LATEST"
          echo "LATEST=$LATEST" >> "$GITHUB_ENV"

      - &image-qemu
        uses: docker/setup-qemu-action@v4

      - &image-buildx
        uses: docker/setup-buildx-action@v4

      - &image-metadata
        name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.LATEST == 'true' }}
          labels: |
            org.opencontainers.image.title=Board Planner
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          annotations: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - &image-build
        name: Build for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-dry-run:
    name: Build the Docker image (dry run, not pushed)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - *image-version
      - *image-checkout
      - *image-latest
      - *image-qemu
      - *image-buildx
      - *image-metadata
      - *image-build
