name: Release

# A tag vX.Y.Z builds the menubar app (worker inside), signs it with the Developer ID, notarises
# and staples it, packs the worker on its own, and attaches both to the GitHub release.
# Run it by hand for a dry run: the same build, kept as a workflow artifact, with no release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the dry-run build (x.y.z)"
        default: "0.0.0"
        required: true
      signed:
        description: "Sign and notarise (needs the signing secrets)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarise, publish
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      SIGNED: ${{ github.event_name == 'push' || inputs.signed }}
      OUT: ${{ github.workspace }}/release-assets
    steps:
      - name: Resolve the version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$PUBLISH" = "true" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$DISPATCH_VERSION"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must be x.y.z (a tag vX.Y.Z), got '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Every signing secret is set
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=()
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions)"
            done
            echo "Missing: ${missing[*]}. Set them, or run by hand with 'signed' off for an unsigned dry run."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Import the Developer ID certificate into a temporary keychain
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"

          # The chain codesign needs, whether or not the runner image carries it
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | grep "($APPLE_TEAM_ID)" | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 holds no 'Developer ID Application' identity for team APPLE_TEAM_ID. Identities found:"
            security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/^/  /'
            exit 1
          fi
          echo "CP_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        if: env.SIGNED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077 && printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY")
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_KEY_P8_BASE64 does not decode to a .p8 private key"; exit 1; }
          {
            echo "CP_NOTARY_KEY_PATH=$KEY"
            echo "CP_NOTARY_KEY_ID=$ASC_KEY_ID"
            echo "CP_NOTARY_ISSUER=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build the app (tests, worker, bundle, sign, notarise, staple)
        working-directory: menubar
        env:
          CP_ARCHS: arm64 x86_64
          CP_VERSION: ${{ env.VERSION }}
          CP_BUILD_NUMBER: ${{ github.run_number }}
        run: make app

      - name: Gatekeeper accepts it
        if: env.SIGNED == 'true'
        working-directory: menubar
        run: |
          codesign --verify --strict --deep --verbose=2 .build/CPMenubar.app
          xcrun stapler validate .build/CPMenubar.app
          spctl --assess --type execute --verbose=4 .build/CPMenubar.app

      - name: Package
        run: |
          mkdir -p "$OUT"
          test -f menubar/.build/CPMenubar.app/Contents/Resources/worker/main.js
          ditto -c -k --keepParent menubar/.build/CPMenubar.app "$OUT/board-planner-menubar-$VERSION.zip"
          worker/pack.sh "$VERSION" "$OUT"
          (cd "$OUT" && shasum -a 256 ./*.zip ./*.tar.gz | sed 's| \./| |' > SHA256SUMS)
          cat "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.VERSION }}${{ env.SIGNED == 'true' && '-signed' || '-unsigned' }}
          path: release-assets/
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$OUT"/* --clobber
          else
            gh release create "$TAG" "$OUT"/* --verify-tag --title "$TAG" --generate-notes
          fi

      - name: Delete the temporary keychain and key
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/developer-id.p12
